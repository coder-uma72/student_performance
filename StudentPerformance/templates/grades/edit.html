<!DOCTYPE html>
<html>
<head>
    <title>Edit Grade</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

    <h2>Student Performance Analytics</h2>

    <div>
        <a href="/students">Students</a>
        <a href="/courses">Courses</a>
        <a href="/grades">Grades</a>
        <a href="/analytics">Analytics</a>
    </div>

</nav>

<div class="container">

    <div class="card">

        <h1>Edit Grade</h1>

        <form method="POST"
              action="/grades/{{ grade.id }}">

            <input type="hidden"
                   name="_method"
                   value="PUT">

            <div class="form-group">

                <label>Student</label>

                <select name="student_id" required>

                    {% for student in students %}

                    <option value="{{ student.id }}"
                        {% if student.id == grade.student_id %}
                        selected
                        {% endif %}>

                        {{ student.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>Course</label>

                <select name="course_id" required>

                    {% for course in courses %}

                    <option value="{{ course.id }}"
                        {% if course.id == grade.course_id %}
                        selected
                        {% endif %}>

                        {{ course.name }} - {{ course.code }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="form-group">

                <label>Score</label>

                <input type="number"
                       name="score"
                       min="0"
                       max="100"
                       step="0.01"
                       value="{{ grade.score }}"
                       required>

            </div>

            <div class="form-group">

                <label>Date</label>

                <input type="date"
                       name="date"
                       value="{{ grade.date }}"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary">
                Update Grade
            </button>

            <a href="/grades"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
