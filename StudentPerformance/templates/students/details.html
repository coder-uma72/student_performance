<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="navbar">
    <h2>Student Performance Analytics</h2>

    <div>
        <a href="/students/view">Students</a>
        <a href="/courses">Courses</a>
        <a href="/grades">Grades</a>
        <a href="/analytics/dashboard">Analytics</a>
    </div>
</div>

<div class="container">

    <div class="card">

        <h1>Student Details</h1>

        <table>
            <tr>
                <th>ID</th>
                <td>{{ student.id }}</td>
            </tr>

            <tr>
                <th>Name</th>
                <td>{{ student.name }}</td>
            </tr>

            <tr>
                <th>Email</th>
                <td>{{ student.email }}</td>
            </tr>
        </table>

        <br>

        <a
            href="/students/{{ student.id }}/edit"
            class="btn btn-success">
            Edit
        </a>

        <a
            href="/students/view"
            class="btn btn-secondary">
            Back to Students
        </a>

    </div>

</div>

</body>
</html>
