<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="navbar">
    <h2>Student Performance Analytics</h2>

    <div>
        <a href="/students/view">Students</a>
        <a href="/courses">Courses</a>
        <a href="/grades">Grades</a>
        <a href="/analytics/dashboard">Analytics</a>
    </div>
</div>

<div class="container">

    <div class="card">

        <h1>Edit Student</h1>

        <form method="POST"
              action="/students/{{ student.id }}">

            <input
                type="hidden"
                name="_method"
                value="PUT"
            >

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ student.name }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ student.email }}"
                    required
                >

            </div>

            <button type="submit" class="btn btn-success">
                Update Student
            </button>

            <a
                href="/students/{{ student.id }}"
                class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
